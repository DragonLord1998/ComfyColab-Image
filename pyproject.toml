[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "comfycolab-image-pack"
version = "0.3.0-dev1"
description = "Standalone ComfyUI image generation, editing, Mage-Flow, and NVIDIA PiD nodes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ComfyColab contributors" },
]
dependencies = [
  "huggingface_hub[hf_xet]>=0.36.0,<1",
]

[project.urls]
Repository = "https://github.com/DragonLord1998/ComfyColab-Image"
Documentation = "https://github.com/DragonLord1998/ComfyColab-Image#readme"
"Bug Tracker" = "https://github.com/DragonLord1998/ComfyColab-Image/issues"

[tool.comfy]
PublisherId = "dragonlord1998"
DisplayName = "ComfyColab Image"
requires-comfyui = ">=0.28.0"

[tool.setuptools]
packages = []
